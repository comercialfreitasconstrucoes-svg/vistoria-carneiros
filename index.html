function Icon({ name, size = 16, color = "currentColor" }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "camera":
      return (<svg {...common}><path d="M4 8h3l1.6-2.4A2 2 0 0 1 10.3 4.6h3.4a2 2 0 0 1 1.7 1L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" /><circle cx="12" cy="13.5" r="3.5" /></svg>);
    case "video":
      return (<svg {...common}><rect x="2.5" y="6.5" width="13" height="11" rx="2" /><path d="M20.5 9.5 16 12l4.5 2.5v-5Z" /></svg>);
    case "users":
      return (<svg {...common}><circle cx="9" cy="8.5" r="3" /><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" /><circle cx="17" cy="9.5" r="2.4" /><path d="M15 14.2c2.3.4 4 2 4 4.8" /></svg>);
    case "check-circle":
      return (<svg {...common}><circle cx="12" cy="12" r="9" /><path d="m8.3 12.3 2.4 2.4 5-5.2" /></svg>);
    case "alert-circle":
      return (<svg {...common}><circle cx="12" cy="12" r="9" /><path d="M12 8v5" /><circle cx="12" cy="16" r="0.6" fill={color} stroke="none" /></svg>);
    case "chevron-left":
      return (<svg {...common}><path d="m14.5 5-7 7 7 7" /></svg>);
    case "chevron-right":
      return (<svg {...common}><path d="m9.5 5 7 7-7 7" /></svg>);
    case "pen":
      return (<svg {...common}><path d="M15.5 4.5 19 8l-9.5 9.5-4 1 1-4Z" /></svg>);
    case "rotate":
      return (<svg {...common}><path d="M4.5 12a7.5 7.5 0 1 1 2.4 5.5" /><path d="M4 16.5V12h4.5" /></svg>);
    case "clipboard":
      return (<svg {...common}><rect x="5" y="4.5" width="14" height="17" rx="2" /><rect x="9" y="3" width="6" height="3" rx="1" /><path d="M8.5 11h7M8.5 15h7" /></svg>);
    case "dot":
      return (<svg width={size} height={size} viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill={color} /></svg>);
    default:
      return null;
  }
}

function SignaturePad({ onChange }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const hasDrawnRef = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * ratio;
    canvas.height = canvas.clientHeight * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.strokeStyle = INK;
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    drawingRef.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };

  const move = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = pos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
    if (!hasDrawnRef.current) {
      hasDrawnRef.current = true;
      onChange(true);
    }
  };

  const end = () => { drawingRef.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawnRef.current = false;
    onChange(false);
  };

  return (
    <div>
      <canvas ref={canvasRef} style={{ width: "100%", height: 140, background: PAPER, border: `1px solid ${LINE}`, borderRadius: 10, touchAction: "none", cursor: "crosshair" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <button onClick={clear} style={{ marginTop: 8, border: "none", background: "none", color: INK_SOFT, fontSize: 13, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", padding: 0 }}>
        <Icon name="rotate" size={13} /> Limpar assinatura
      </button>
    </div>
  );
}

        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 600 }}>Apto 116</div>
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <button onClick={() => setModo("presencial")} style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: `1px solid ${modo === "presencial" ? "#FFFFFF" : "rgba(255,255,255,0.3)"}`, background: modo === "presencial" ? "rgba(255,255,255,0.16)" : "transparent", color: "#FFFFFF", fontSize: 12.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer" }}>
            <Icon name="users" size={14} /> Presencial
          </button>
          <button onClick={() => setModo("video")} style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: `1px solid ${modo === "video" ? "#FFFFFF" : "rgba(255,255,255,0.3)"}`, background: modo === "video" ? "rgba(255,255,255,0.16)" : "transparent", color: "#FFFFFF", fontSize: 12.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, cursor: "pointer" }}>
            <Icon name="video" size={14} /> Videoconferência
          </button>
        </div>
      </div>

      {modo === "video" && screen === "checklist" && (
        <div style={{ background: PEND_BG, color: PEND_COLOR, fontSize: 12.5, padding: "9px 20px", display: "flex", alignItems: "center", gap: 8 }}>
          <Icon name="dot" size={7} color={PEND_COLOR} />
          Chamada ao vivo — a equipe técnica preenche o checklist junto com o cliente
        </div>
      )}

      {screen === "checklist" && (
        <React.Fragment>
          <div style={{ padding: "16px 20px 8px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: INK_SOFT, marginBottom: 6 }}>
              <span>{preenchidos} de {TOTAL_ITENS} itens avaliados</span>
              <span>{progresso}%</span>
            </div>
            <div style={{ height: 5, background: LINE, borderRadius: 3, overflow: "hidden" }}>
              <div style={{ width: `${progresso}%`, height: "100%", background: BRAND, transition: "width 0.3s" }} />
            </div>
          </div>

          <div style={{ display: "flex", gap: 6, padding: "8px 20px 4px", overflowX: "auto" }}>
            {AREAS.map((a, i) => {
              const feitos = a.itens.filter((it) => itens[it.id] && itens[it.id].status).length;
              const completo = feitos === a.itens.length;
              return (
                <button key={a.id} onClick={() => setAreaIndex(i)} style={{ flexShrink: 0, padding: "6px 12px", borderRadius: 20, border: `1px solid ${i === areaIndex ? BRAND_DARK : LINE}`, background: i === areaIndex ? BRAND_DARK : completo ? OK_BG : CARD, color: i === areaIndex ? "#FFFFFF" : completo ? OK_COLOR : INK_SOFT, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {a.nome}
                </button>
              );
            })}
          </div>

          <div style={{ padding: "12px 20px 4px", display: "flex", flexDirection: "column", gap: 10 }}>
            {area.itens.map((item) => {
              const v = itens[item.id] || {};
              return (
                <div key={item.id} style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: "12px 14px" }}>
                  <div style={{ fontSize: 13.5, fontWeight: 500, marginBottom: 10 }}>{item.label}</div>
                  <div style={{ display: "flex", gap: 8, marginBottom: v.status === "pendencia" ? 8 : 0 }}>
                    <button onClick={() => setStatus(item.id, "ok")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 8, border: `1px solid ${v.status === "ok" ? OK_COLOR : LINE}`, background: v.status === "ok" ? OK_BG : "transparent", color: v.status === "ok" ? OK_COLOR : INK_SOFT, fontSize: 12.5, cursor: "pointer" }}>
                      <Icon name="check-circle" size={14} /> Conforme
                    </button>
                    <button onClick={() => setStatus(item.id, "pendencia")} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 0", borderRadius: 8, border: `1px solid ${v.status === "pendencia" ? PEND_BORDER : LINE}`, background: v.status === "pendencia" ? PEND_BG : "transparent", color: v.status === "pendencia" ? PEND_COLOR : INK_SOFT, fontSize: 12.5, cursor: "pointer" }}>
                      <Icon name="alert-circle" size={14} /> Pendência
                    </button>
                  </div>
                  {v.status === "pendencia" && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      <textarea placeholder="Descreva a pendência encontrada" value={v.obs || ""} onChange={(e) => setObs(item.id, e.target.value)} rows={2}
                        style={{ width: "100%", resize: "none", border: `1px solid ${LINE}`, borderRadius: 8, padding: "8px 10px", fontSize: 12.5, fontFamily: "'Inter', sans-serif", boxSizing: "border-box", background: PAPER, color: INK }} />
                      <button onClick={() => setFoto(item.id)} style={{ display: "flex", alignItems: "center", gap: 6, alignSelf: "flex-start", border: `1px dashed ${v.foto ? OK_COLOR : LINE}`, background: v.foto ? OK_BG : "transparent", color: v.foto ? OK_COLOR : INK_SOFT, borderRadius: 8, padding: "6px 10px", fontSize: 12, cursor: "pointer" }}>
                        <Icon name="camera" size={13} /> {v.foto ? "Foto/vídeo anexado" : "Anexar foto ou vídeo"}
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 20px 0" }}>
            <button onClick={() => setAreaIndex((i) => Math.max(0, i - 1))} disabled={areaIndex === 0} style={{ display: "flex", alignItems: "center", gap: 4, border: "none", background: "none", color: areaIndex === 0 ? LINE : INK_SOFT, fontSize: 12.5, cursor: areaIndex === 0 ? "default" : "pointer", padding: 0 }}>
              <Icon name="chevron-left" size={15} /> Anterior
            </button>
            <button onClick={() => setAreaIndex((i) => Math.min(AREAS.length - 1, i + 1))} disabled={areaIndex === AREAS.length - 1} style={{ display: "flex", alignItems: "center", gap: 4, border: "none", background: "none", color: areaIndex === AREAS.length - 1 ? LINE : INK_SOFT, fontSize: 12.5, cursor: areaIndex === AREAS.length - 1 ? "default" : "pointer", padding: 0 }}>
              Próximo ambiente <Icon name="chevron-right" size={15} />
            </button>
          </div>

          {error && <div style={{ margin: "14px 20px 0", color: PEND_COLOR, fontSize: 12.5 }}>{error}</div>}

          <div style={{ padding: "18px 20px 20px" }}>
            <button onClick={irParaAssinatura} style={{ width: "100%", padding: "13px 0", borderRadius: 10, border: "none", background: BRAND_DARK, color: "#FFFFFF", fontSize: 14, fontWeight: 500, cursor: "pointer" }}>
              Concluir vistoria e coletar aceite
            </button>
          </div>
        </React.Fragment>
      )}

      {screen === "assinatura" && (
        <div style={{ padding: "20px" }}>
          <button onClick={() => setScreen("checklist")} style={{ display: "flex", alignItems: "center", gap: 4, border: "none", background: "none", color: INK_SOFT, fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 16 }}>
            <Icon name="chevron-left" size={15} /> Voltar ao checklist
          </button>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 17, fontWeight: 600, marginBottom: 4 }}>Resumo da vistoria</div>
          <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 16 }}>{TOTAL_ITENS - pendencias.length} itens conformes · {pendencias.length} pendências registradas</div>

          {pendencias.length > 0 && (
            <div style={{ background: PEND_BG, border: `1px solid ${PEND_BORDER}55`, borderRadius: 10, padding: "10px 14px", marginBottom: 18 }}>
              {pendencias.map(([id, v]) => {
                const item = AREAS.flatMap((a) => a.itens).find((it) => it.id === id);
                return (
                  <div key={id} style={{ fontSize: 12.5, color: PEND_COLOR, marginBottom: 4 }}>
                    <Icon name="alert-circle" size={12} /> {item && item.label}{v.obs ? ` — ${v.obs}` : ""}
                  </div>
                );
              })}
            </div>
          )}

          <label style={{ fontSize: 12.5, color: INK_SOFT, display: "block", marginBottom: 6 }}>Nome completo do cliente</label>
          <input value={nomeCliente} onChange={(e) => setNomeCliente(e.target.value)} placeholder="Nome de quem está assinando"
            style={{ width: "100%", border: `1px solid ${LINE}`, borderRadius: 8, padding: "9px 12px", fontSize: 13, boxSizing: "border-box", marginBottom: 16, background: PAPER, color: INK }} />

          <label style={{ fontSize: 12.5, color: INK_SOFT, display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}>
            <Icon name="pen" size={13} /> Assinatura de aceite
          </label>
          <SignaturePad onChange={setSigned} />

          <div style={{ fontSize: 11.5, color: INK_SOFT, marginTop: 10, lineHeight: 1.5 }}>
            Ao assinar, o cliente confirma o recebimento da unidade nos termos descritos acima, incluindo as pendências listadas, que ficam registradas para acompanhamento pela equipe técnica.
          </div>

          {error && <div style={{ marginTop: 12, color: PEND_COLOR, fontSize: 12.5 }}>{error}</div>}

          <button onClick={confirmarAceite} style={{ width: "100%", padding: "13px 0", borderRadius: 10, border: "none", background: BRAND_DARK, color: "#FFFFFF", fontSize: 14, fontWeight: 500, cursor: "pointer", marginTop: 18 }}>
            Confirmar aceite
          </button>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginTop: 28 }}>
            <img src={FREITAS_LOGO} alt="Freitas Construções" style={{ height: 26, width: "auto", opacity: 0.55 }} />
            <span style={{ fontSize: 10.5, color: INK_SOFT, opacity: 0.7 }}>construção e entrega</span>
          </div>
        </div>
      )}

      {screen === "concluido" && (
        <div style={{ padding: "40px 24px", textAlign: "center" }}>
          <div style={{ width: 52, height: 52, borderRadius: "50%", background: OK_BG, color: OK_COLOR, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <Icon name="check-circle" size={26} />
          </div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 600, marginBottom: 6 }}>Vistoria concluída</div>
          <div style={{ fontSize: 13, color: INK_SOFT, lineHeight: 1.6, marginBottom: 4 }}>Aceite assinado por {nomeCliente || "cliente"} para o Apto 116.</div>
          <div style={{ fontSize: 13, color: INK_SOFT, lineHeight: 1.6 }}>
            {pendencias.length > 0 ? `${pendencias.length} pendências foram registradas e serão acompanhadas pela equipe técnica.` : "Nenhuma pendência foi registrada."}
          </div>
          <div style={{ marginTop: 24, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 12, color: INK_SOFT }}>
            <Icon name="clipboard" size={14} /> Relatório disponível para o cliente e para a construtora
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginTop: 32, paddingTop: 20, borderTop: `1px solid ${LINE}` }}>
            <img src={CARNEIROS_LOGO} alt="Carneiros Residence Resort" style={{ height: 28, width: "auto" }} />
            <img src={FREITAS_LOGO} alt="Freitas Construções" style={{ height: 30, width: "auto" }} />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<VistoriaApp />);
</script>
</body>
</html>
